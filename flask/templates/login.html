<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &mdash; Pasale Dai Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:18px;">
        <span class="brand-badge">PD</span>
        <span class="brand-title" style="font-size:14px;">Pasale Dai</span>
      </div>

      <h1 class="auth-title">Administrative Sign In</h1>
      <p class="auth-sub">Enter your store operator credentials to continue.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="flash-message mono" style="margin-bottom:18px;">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="e.g. admin">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-dark" style="width:100%; padding:10px; margin-top:8px;">Sign In &rarr;</button>
      </form>
    </div>
  </div>
</body>
</html>
