<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Not Found &mdash; Pasale Dai</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;">
  <div style="text-align:center; max-width:420px; background:#fff; padding:36px; border-radius:16px; border:1px solid var(--border-default); box-shadow:var(--shadow-md);">
    <div class="pill-badge pill-pending mono" style="margin-bottom:12px;">404 NOT FOUND</div>
    <h1 style="font-size:18px; font-weight:700;">Order Reference Missing</h1>
    <p style="font-size:13px; color:var(--text-muted); margin:12px 0 24px;">
      Could not find order <code class="mono" style="font-weight:700; color:var(--text-main);">{{ order_ref }}</code> in our system. Please check with customer support on Discord.
    </p>
    <a href="/" class="btn btn-dark" style="width:100%;">Return to Store</a>
  </div>
</body>
</html>
